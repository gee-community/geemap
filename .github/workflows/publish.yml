name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g., v0.39.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run only (build package, skip uploading to PyPI)'
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Type YES to confirm manual publish to PyPI'
        required: true
        type: string

jobs:
  pypi-publish:
    name: Build & Upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate manual confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "YES" ]; then
            echo "::error::Manual publish requires confirm=YES. Aborting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Inspect built artifacts
        run: |
          ls -la dist/

      - name: Publish to PyPI
        if: github.event_name == 'release' || !inputs.dry_run
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          password: ${{ secrets.PYPI_PASSWORD || secrets.PYPI_API_TOKEN }}
